name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vue3/parking-vue/package-lock.json
      - name: Start isolated verification infrastructure
        run: |
          python3 scripts/init-env.py
          docker compose -p parking-verification -f compose.yml -f compose.background.yml -f compose.test.yml -f compose.background.test.yml --profile background up -d --wait mysql redis redis-cache rabbitmq
      - name: Backend and migration tests
        run: |
          set -a
          source .env
          set +a
          export PARKING_INTEGRATION_TESTS=true PARKING_BACKGROUND_TESTS=true PARKING_DOCKER_RECOVERY_TESTS=true PARKING_COMPOSE_PROJECT=parking-verification
          export TEST_DB_URL='jdbc:mysql://127.0.0.1:23307/parking_springboot?serverTimezone=Asia/Shanghai' TEST_REDIS_PORT=26380 TEST_CACHE_PORT=26381
          cd parking/parking
          sh ./mvnw -B verify
          cd ../..
          python3 scripts/test-migration.py
      - name: Frontend tests and production build
        working-directory: vue3/parking-vue
        run: |
          npm ci
          npm test
          npm run test:components
          npm run build
      - name: Browser verification against production containers
        run: |
          set -a
          source .env
          set +a
          export BACKGROUND_TASKS_ENABLED=true
          docker compose -p parking-verification -f compose.yml -f compose.background.yml -f compose.test.yml -f compose.background.test.yml --profile background up -d --build --wait backend frontend
          cd vue3/parking-vue
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Stop verification services and retain volumes
        if: always()
        run: docker compose -p parking-verification -f compose.yml -f compose.background.yml -f compose.test.yml -f compose.background.test.yml --profile background down
