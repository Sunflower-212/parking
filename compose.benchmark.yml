name: parking-benchmark
services:
  mysql:
    image: mysql:8.4.4
    environment:
      MYSQL_ROOT_PASSWORD: ${BENCH_ROOT_PASSWORD:?Run scripts/benchmark.py prepare}
      MYSQL_DATABASE: parking_springboot
      MYSQL_USER: parking
      MYSQL_PASSWORD: ${BENCH_DB_PASSWORD:?Run scripts/benchmark.py prepare}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--innodb-buffer-pool-size=1G", "--max-connections=100", "--max-execution-time=5000"]
    volumes:
      - benchmark-mysql:/var/lib/mysql
      - ./.work/benchmark-init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:13307:3306"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -e 'SELECT 1' parking_springboot >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 40
  redis:
    image: redis:7.4.2-alpine
    environment: {REDIS_PASSWORD: "${BENCH_REDIS_PASSWORD:?Run scripts/benchmark.py prepare}"}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    volumes: ["benchmark-redis:/data"]
    ports: ["127.0.0.1:16380:6379"]
  redis-cache:
    image: redis:7.4.2-alpine
    environment: {REDIS_PASSWORD: "${BENCH_CACHE_PASSWORD:?Run scripts/benchmark.py prepare}"}
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lfu --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:16381:6379"]
  backend:
    image: ${BENCH_BACKEND_IMAGE:-parking-baseline-backend:797313c}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/parking_springboot?serverTimezone=Asia/Shanghai
      DB_USER: parking
      DB_PASSWORD: ${BENCH_DB_PASSWORD}
      DB_POOL_SIZE: 20
      PARKING_ADMISSION_PERMITS: ${BENCH_ADMISSION_PERMITS:-4}
      CAPACITY_BUCKETS: ${BENCH_CAPACITY_BUCKETS:-1}
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 20
      REDIS_HOST: redis
      REDIS_PASSWORD: ${BENCH_REDIS_PASSWORD}
      CACHE_ENABLED: ${BENCH_CACHE_ENABLED:-false}
      CACHE_LOCAL_ENABLED: ${BENCH_LOCAL_CACHE:-false}
      CACHE_REDIS_HOST: redis-cache
      CACHE_REDIS_PASSWORD: ${BENCH_CACHE_PASSWORD}
      JWT_SECRET: ${BENCH_JWT_SECRET}
      BOOTSTRAP_ADMIN_USERNAME: benchmark
      BOOTSTRAP_ADMIN_PASSWORD: ${BENCH_ADMIN_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1g
      AI_ENABLED: "false"
      RESERVATION_TIMEOUT: 30m
    ports: ["127.0.0.1:18080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      start_period: 15s
      retries: 30
    depends_on: {mysql: {condition: service_healthy}, redis: {condition: service_started}, redis-cache: {condition: service_started}}
  frontend:
    image: ${BENCH_FRONTEND_IMAGE:-parking-baseline-frontend:797313c}
    ports: ["127.0.0.1:18088:80"]
    depends_on: {backend: {condition: service_healthy}}
volumes:
  benchmark-mysql:
  benchmark-redis:
