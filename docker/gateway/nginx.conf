worker_processes 1;
error_log /dev/stderr crit;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format entry_json escape=json '{"time":"$time_iso8601","event":"gateway.request","requestId":"$upstream_http_x_request_id","method":"$request_method","status":$status,"elapsedSeconds":$request_time}';
    access_log /dev/stdout entry_json;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 6m;
    # Relative redirects preserve the external scheme and port, including test ports.
    absolute_redirect off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream parking_frontend {
        zone parking_frontend 64k;
        server parking-web:80 resolve;
        keepalive 8;
    }
    include /etc/nginx/servers/*.conf;
}
