location = /parking {
    return 308 /parking/$is_args$args;
}

# Strip the public prefix once; the app Nginx still receives /api/ and /assets/.
location ^~ /parking/api/ai/chat {
    proxy_pass http://parking_frontend/api/ai/chat;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 300s;
}

location ^~ /parking/ {
    proxy_pass http://parking_frontend/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
}
