resolver 127.0.0.11 valid=5s ipv6=off;
upstream parking_backend {
    zone parking_backend 64k;
    server backend:8080 resolve;
}
log_format parking_json escape=json '{"time":"$time_iso8601","event":"nginx.request","requestId":"$request_id","method":"$request_method","status":$status,"elapsedSeconds":$request_time}';
server {
    access_log /dev/stdout parking_json;
    # Default error logs include the original request line (AI prompts may be query parameters).
    # Detailed upstream failures are diagnosed through sanitized access and application logs.
    error_log /dev/stderr crit;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 6m;
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # 仅带内容哈希的构建资源长期缓存；入口 HTML 单独重新校验，避免部署后仍引用旧资源。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location /api/ai/chat {
        proxy_pass http://parking_backend/ai/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $request_id always;
        proxy_set_header Connection "";
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 300s;
    }
    location /api/ {
        proxy_pass http://parking_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $request_id always;
        proxy_read_timeout 30s;
        proxy_set_header Connection "";
    }
    location / { try_files $uri $uri/ /index.html; }
}
